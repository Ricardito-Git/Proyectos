<div class="contenedor">
  <div class="semaforo">
    <div class="luz rojo" [class.encendido]="colorActivo === 'rojo'"></div>
    <div class="luz amarillo" [class.encendido]="colorActivo === 'amarillo'"></div>
    <div class="luz verde" [class.encendido]="colorActivo === 'verde'"></div>
  </div>

  <div class="botones">
    <button (click)="cambiarColor('rojo')">Parar</button>
    <button (click)="cambiarColor('amarillo')">Precaución</button>
    <button (click)="cambiarColor('verde')">Avanzar</button>
  </div>
</div>



<style>
  .contenedor { text-align: center ; font-family: sans-serif;}
  .semaforo {
    background: #333; width: 80px; padding: 20px;
    border-radius: 20px; margin: 20px auto; 
  }
  .luz{
    width: 60px; height: 60px; border-radius: 50px;
    margin: 10px auto; opacity: 0.2; transition: 0.3s;
  }

  .rojo { background: red;} 
  .amarillo { background: yellow;}
  .verde { background: lime;}
  .encendido {opacity: 1; box-shadow: 0 0 20px white;}

  button { margin: 5px; padding: 10px; cursor: pointer;}
</style>
